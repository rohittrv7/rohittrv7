<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs><radialGradient id="core"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#4c1d95"/></radialGradient></defs>
  <style>
    .mono{font-family:'Courier New',monospace}
    .sans{font-family:'Segoe UI',Arial,sans-serif}
    .chip{fill:#111936;stroke:#334155}
    .t{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;fill:#e2e8f0}
    .h{font-family:'Courier New',monospace;font-size:12px;fill:#38bdf8}
  </style>
  <rect width="900" height="340" rx="18" fill="#0b1020" stroke="#6d4cff" stroke-opacity=".6"/>
  <text x="30" y="40" class="h">// TECH STACK</text>
  <text x="30" y="68" class="sans" font-size="24" font-weight="700" fill="#fff">Tools I build with</text>
  <g transform="translate(200 200)">
    <circle r="45" fill="url(#core)"><animate attributeName="r" values="45;49;45" dur="3s" repeatCount="indefinite"/></circle>
    <text y="8" text-anchor="middle" class="mono" font-size="22" fill="#fff">&lt;/&gt;</text>
    <ellipse rx="95" ry="95" fill="none" stroke="#475569" stroke-dasharray="3 6"/>
    <ellipse rx="140" ry="70" fill="none" stroke="#475569" stroke-dasharray="3 6" transform="rotate(-25)"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <g transform="translate(95 0)"><circle r="16" fill="#3178c6"/><text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#fff">TS</text></g>
      <g transform="translate(-95 0)"><circle r="16" fill="#61dafb"/><text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0b1020">Re</text></g>
    </g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
      <g transform="translate(0 -95)"><circle r="16" fill="#68a063"/><text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#fff">No</text></g>
      <g transform="translate(0 95)"><circle r="16" fill="#f7df1e"/><text y="5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#0b1020">JS</text></g>
    </g>
  </g>
  <g>
    <text x="440" y="110" class="h">MOBILE</text>
    <g transform="translate(440 120)"><rect class="chip" width="130" height="30" rx="8"/><text class="t" x="14" y="20">React Native</text></g>
    <g transform="translate(580 120)"><rect class="chip" width="80" height="30" rx="8"/><text class="t" x="14" y="20">Expo</text></g>
    <text x="440" y="180" class="h">FRONTEND &amp; BACKEND</text>
    <g transform="translate(440 190)"><rect class="chip" width="120" height="30" rx="8"/><text class="t" x="14" y="20">TypeScript</text></g>
    <g transform="translate(570 190)"><rect class="chip" width="80" height="30" rx="8"/><text class="t" x="14" y="20">React</text></g>
    <g transform="translate(660 190)"><rect class="chip" width="90" height="30" rx="8"/><text class="t" x="14" y="20">Node.js</text></g>
    <text x="440" y="250" class="h">DATA &amp; TOOLS</text>
    <g transform="translate(440 260)"><rect class="chip" width="110" height="30" rx="8"/><text class="t" x="14" y="20">Firebase</text></g>
    <g transform="translate(560 260)"><rect class="chip" width="100" height="30" rx="8"/><text class="t" x="14" y="20">MongoDB</text></g>
    <g transform="translate(670 260)"><rect class="chip" width="70" height="30" rx="8"/><text class="t" x="14" y="20">Git</text></g>
  </g>
</svg>
