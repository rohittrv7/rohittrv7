<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ec4899"><animate attributeName="stop-color" values="#ec4899;#38bdf8;#a855f7;#ec4899" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:'Courier New',monospace}
    .sans{font-family:'Segoe UI',Arial,sans-serif}
    .r{opacity:0;animation:cycle 9s infinite}
    .r2{animation-delay:3s}.r3{animation-delay:6s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0}}
    .s{animation:tw 3s infinite ease-in-out}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .badge{animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
  <rect width="900" height="260" rx="18" fill="url(#bg)" stroke="#6d4cff" stroke-opacity=".6"/>
  <g fill="#fff">
    <circle class="s" cx="80" cy="40" r="2"/><circle class="s" cx="300" cy="25" r="1.5" style="animation-delay:.8s"/>
    <circle class="s" cx="620" cy="50" r="2" style="animation-delay:1.4s"/><circle class="s" cx="820" cy="30" r="1.5" style="animation-delay:2s"/>
    <circle class="s" cx="760" cy="210" r="2" style="animation-delay:.5s"/><circle class="s" cx="150" cy="220" r="1.5" style="animation-delay:1.1s"/>
  </g>
  <rect x="50" y="40" width="190" height="26" rx="13" fill="#0ea5e9" fill-opacity=".15" stroke="#0ea5e9"/>
  <circle class="badge" cx="68" cy="53" r="5" fill="#22c55e"/>
  <text x="82" y="58" class="mono" font-size="12" fill="#7dd3fc">OPEN TO WORK</text>
  <text x="50" y="105" class="sans" font-size="22" fill="#cbd5e1">Hi there, I'm</text>
  <text x="50" y="160" class="sans" font-size="58" font-weight="800" fill="url(#name)">Rohit Kumar</text>
  <g class="mono" font-size="20" fill="#e2e8f0">
    <text class="r" x="50" y="205">&gt; Full-Stack &amp; Mobile App Developer</text>
    <text class="r r2" x="50" y="205">&gt; React Native · TypeScript · Node.js</text>
    <text class="r r3" x="50" y="205">&gt; Building apps at buildmyapp.store</text>
  </g>
  <g transform="translate(740 130)">
    <circle r="62" fill="none" stroke="#6d4cff" stroke-opacity=".5" stroke-dasharray="4 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></circle>
    <circle r="38" fill="#7c3aed"><animate attributeName="r" values="38;42;38" dur="3s" repeatCount="indefinite"/></circle>
    <text y="9" text-anchor="middle" class="mono" font-size="26" fill="#fff">&lt;/&gt;</text>
  </g>
</svg>
