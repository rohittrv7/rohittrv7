<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <style>
    .mono{font-family:'Courier New',monospace}
    .sans{font-family:'Segoe UI',Arial,sans-serif}
    .swing{transform-origin:150px 20px;animation:sw 4s ease-in-out infinite}
    @keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    .bar{transform-origin:0 0;animation:grow 2.5s ease-out forwards}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect width="900" height="300" rx="18" fill="#0b1020" stroke="#6d4cff" stroke-opacity=".6"/>
  <g class="swing">
    <rect x="140" y="0" width="20" height="50" fill="#a855f7"/>
    <rect x="50" y="50" width="200" height="230" rx="16" fill="#1e1b4b" stroke="#818cf8"/>
    <rect x="68" y="70" width="40" height="28" rx="6" fill="#facc15"/>
    <circle cx="150" cy="150" r="42" fill="#312e81" stroke="#a78bfa"/>
    <text x="150" y="162" text-anchor="middle" class="mono" font-size="34" fill="#fff">RK</text>
    <text x="150" y="222" text-anchor="middle" class="sans" font-size="20" font-weight="700" fill="#fff">Rohit Kumar</text>
    <text x="150" y="244" text-anchor="middle" class="mono" font-size="11" fill="#a5b4fc">APP DEVELOPER</text>
    <text x="150" y="264" text-anchor="middle" class="mono" font-size="10" fill="#22c55e">● OPEN TO COLLAB</text>
  </g>
  <text x="320" y="50" class="mono" font-size="12" fill="#38bdf8">// DEVELOPER DASHBOARD</text>
  <text x="320" y="80" class="sans" font-size="24" font-weight="700" fill="#fff">Profile at a glance</text>
  <g class="sans">
    <rect x="320" y="100" width="130" height="64" rx="10" fill="#111936" stroke="#334155"/>
    <text x="336" y="140" font-size="30" font-weight="800" fill="#fff">782</text><text x="336" y="156" font-size="10" fill="#94a3b8" class="mono">CONTRIBUTIONS / YR</text>
    <rect x="465" y="100" width="130" height="64" rx="10" fill="#111936" stroke="#334155"/>
    <text x="481" y="140" font-size="30" font-weight="800" fill="#fff">4+</text><text x="481" y="156" font-size="10" fill="#94a3b8" class="mono">PINNED PROJECTS</text>
    <rect x="610" y="100" width="130" height="64" rx="10" fill="#111936" stroke="#334155"/>
    <text x="626" y="140" font-size="30" font-weight="800" fill="#fff">TS</text><text x="626" y="156" font-size="10" fill="#94a3b8" class="mono">MAIN LANGUAGE</text>
  </g>
  <text x="320" y="200" class="mono" font-size="11" fill="#94a3b8">MY PROJECTS</text>
  <g class="mono" font-size="12" fill="#e2e8f0">
    <text x="320" y="225">buildmyapp</text><rect x="430" y="214" width="300" height="10" rx="5" fill="#1e293b"/><rect class="bar" x="430" y="214" width="280" height="10" rx="5" fill="#a855f7"/>
    <text x="320" y="248">chatting-app</text><rect x="430" y="237" width="300" height="10" rx="5" fill="#1e293b"/><rect class="bar" x="430" y="237" width="220" height="10" rx="5" fill="#6366f1" style="animation-delay:.3s"/>
    <text x="320" y="271">digital-board</text><rect x="430" y="260" width="300" height="10" rx="5" fill="#1e293b"/><rect class="bar" x="430" y="260" width="170" height="10" rx="5" fill="#38bdf8" style="animation-delay:.6s"/>
  </g>
</svg>
